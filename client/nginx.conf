# nginx config for the production bundle.
#
# Two jobs:
#   1. serve the built React app as static files
#   2. forward /api/* to the API container
#
# Because both live behind the same hostname, the browser only ever makes
# same-origin requests. That removes CORS from the equation completely and
# means one certificate covers the whole site.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed asset filenames, so the contents of /assets can be
    # cached forever. index.html must not be cached - it is the file that
    # points at the current asset hashes, and a stale copy pins the browser
    # to an old bundle.
    location /assets/ {
        # One Cache-Control only: "expires 1y" emits its own max-age, and
        # pairing it with add_header here would send the header twice.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: every unknown path is a client-side route, so it has
    # to return index.html rather than a 404. Anything that does exist on
    # disk (favicon, robots.txt) is served from here directly, which is why
    # the headers are included in this location too.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # Pass the address through unchanged instead of appending
        # $remote_addr. The reverse proxy in front of this container
        # (Caddy) has already resolved the real client address - from
        # Cloudflare's CF-Connecting-IP header when the site is proxied.
        # Appending here would add a second, useless hop and shift the
        # address the API's rate limiter keys on.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # the API sets its own security headers via helmet; the static side
    # includes the snippet in the two locations above instead
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

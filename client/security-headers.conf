# Security headers for the static bundle.
#
# These live in a snippet rather than in the server block because nginx does
# not merge add_header across levels: the moment a location declares one
# add_header of its own, it inherits none from the enclosing server. The two
# locations that serve files directly both declare a Cache-Control, so each
# has to include this file explicitly.
#
# Kept out of the server block on purpose. /api/ responses already carry
# helmet's headers, and adding these on top produced two Referrer-Policy
# values with different contents - browsers pick one, and which one is not
# something worth leaving to chance.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

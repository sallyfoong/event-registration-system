name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (server, with coverage)
        run: npm test
      - name: Build (client + server)
        run: npm run build

  # Separate job on purpose: the E2E suite needs a browser and a booted stack,
  # which is minutes of setup the unit job shouldn't pay for on every push.
  # A failure here blocks the PR just the same, so splitting costs nothing in
  # rigour and keeps the fast feedback fast.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # No Docker and no MySQL: the suite boots the API against a throwaway
      # SQLite file (see e2e/serve-api.mjs), so this job has no services to
      # wait on and can't fail because a container was slow to start.
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
